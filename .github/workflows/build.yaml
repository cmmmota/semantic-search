name: Build and push to Gitea

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Job pods have no Docker daemon: the build runs on the cluster's
      # buildkitd (k8s_homelab kubernetes/apps/buildkit), reachable only from
      # the runner's job pods.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      # Gitea's registry refuses the job token (it carries no package scope),
      # so pushes use ci-bot's write:package token, a BCDHome org secret.
      - uses: docker/login-action@v4
        with:
          registry: gitea.bcdhome.net
          username: ci-bot
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: gitea.bcdhome.net/${{ github.repository }}
          # vX.Y.Z on tags; the short sha on every main build; `main` moves.
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
